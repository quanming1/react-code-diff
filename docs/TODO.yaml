        acceptance: 现有 API 零破坏（desktop 端 FileRenderer 直接换包可用）；CodeEditor 可编辑 + 事件回调；tab 切换复用 DOM；diff 结果缓存

      - id: D8
        title: 性能验收与发布（DOM 对比 / 切换耗时 / 滚动帧率 / 编辑延迟 / 迁移）
        status: todo
        prd: docs/prd/PRD-D8-perf-acceptance.md
        prd_status: 草稿
        modules:
